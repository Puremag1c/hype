name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install bats (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core
      - name: Install bats (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats
      - run: ./tests/run_tests.sh unit

  integration:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install beads
        run: |
          git clone --depth 1 https://github.com/steveyegge/beads.git /tmp/beads
          cd /tmp/beads/cmd/bd && CGO_ENABLED=0 go build -o $HOME/go/bin/bd .
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Install bats + parallel (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core parallel
      - name: Install bats + parallel (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats jq parallel
      - run: ./tests/run_tests.sh integration
        continue-on-error: true

  e2e:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Install beads
        run: |
          git clone --depth 1 https://github.com/steveyegge/beads.git /tmp/beads
          cd /tmp/beads/cmd/bd && CGO_ENABLED=0 go build -o $HOME/go/bin/bd .
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Install bats + parallel (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core parallel
      - name: Install bats + parallel (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats jq parallel
      - run: ./tests/run_tests.sh e2e
        continue-on-error: true
